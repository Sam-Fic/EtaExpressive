name: Eta Build

on:
  # 日常开发直接在 main 上推送，不再为每次 push 出包；只在发版标签或手动触发时构建。
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 与打包并行且不接触签名 Secrets；失败不影响 APK 上传，但会阻止发版草稿
  verify:
    name: Lint 与单元测试
    runs-on: ubuntu-latest
    # 正常一轮约 18 分钟（lint 7 分钟 + 全量单测 10 分钟出头）。之前抬到 75 分钟是误判：
    # 真正原因不是套件变长，而是 UserTerminalControllerTest 的常驻 shell 用例偶发死等
    # 状态行，把整个 build 钉住直到 job 被取消。现在控制器在状态行不可达时退出、
    # 每个用例另有 30 秒上限，45 分钟留足正常波动余量即可。
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: Lint 与单元测试
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          :app:lintDebug :app:testDebugUnitTest

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 还原发布证书
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" ||
                -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" ||
                -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::缺少 Release 签名 Secrets，请检查仓库的 Actions Secrets。"
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-release.p12"

      - name: 构建 Debug 与 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.p12
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleDebug :app:assembleRelease

      - name: 验证并整理 APK
        id: apk
        run: |
          # Eta底座沿用 AGP 默认产物名（app-debug.apk / app-release.apk），按数量校验后取用
          shopt -s nullglob
          debug_apks=(app/build/outputs/apk/debug/*.apk)
          release_apks=(app/build/outputs/apk/release/*.apk)
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ${#debug_apks[@]} -ne 1 ]]; then
            echo "::error::Debug APK 数量异常（${#debug_apks[@]}）。"
            exit 1
          fi
          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "::error::Release APK 数量异常（${#release_apks[@]}）。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          "$apksigner_path" verify "${release_apks[0]}"

          # 发版标签必须与 versionName 一致，避免标签与安装包版本错位
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="$(jq -r '.elements[0].versionName' \
              app/build/outputs/apk/release/output-metadata.json)"
            if [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
              echo "::error::标签 $GITHUB_REF_NAME 与 versionName $version_name 不一致。"
              exit 1
            fi
          fi
          echo "debug_path=${debug_apks[0]}" >> "$GITHUB_OUTPUT"
          echo "release_path=${release_apks[0]}" >> "$GITHUB_OUTPUT"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  # 构建 job 持有签名 Secrets，写 Release 的权限单独放在这里，且只在发版标签上运行
  draft-release:
    name: 创建 Release 草稿
    needs: [verify, build-apks]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # 未压缩上传的 Artifact 以文件名命名。文件名不经 job outputs 传递：
      # 输出值只要包含任一 Secret 的子串就会被 Actions 整体丢弃，下载步骤随之退化为下载全部产物。
      # Eta底座沿用 AGP 默认产物名，Release APK 固定为 app-release.apk。
      - name: 下载 Release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app-release.apk
          path: ${{ runner.temp }}/release

      # 只建草稿：草稿不会出现在 releases/latest，App 内更新检查要等维护者手动发布后才可见
      - name: 创建 Release 草稿
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ runner.temp }}/release/app-release.apk
        run: >-
          gh release create "$GITHUB_REF_NAME" "$APK_PATH"
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
