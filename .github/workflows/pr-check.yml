name: PR Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 名称会作为 main 分支规则集的必需检查，修改时同步更新仓库规则集
    name: Lint / Test / Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      # PR 来自 fork 时拿不到 Secrets，这里只做无需签名的检查
      - name: Lint、单元测试与 Debug 构建
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: 校验 Room schema 导出已提交
        # app/schemas 由 KSP 生成但必须提交：实体改了而没把重新导出的 JSON 交上来，
        # 就等于把「同版本号不同结构」这类漂移重新放回暗处（v39 那次闪退就是这么来的）。
        # 只看 git diff 会漏掉升版本新增的未跟踪文件，两种形态一起查。
        run: |-
          untracked=$(git ls-files --others --exclude-standard app/schemas)
          if [ -n "$untracked" ] || ! git diff --quiet --exit-code app/schemas; then
            echo "::error::app/schemas 与实体定义不一致：KSP 重新导出了 schema，但改动没随提交带上。请 git add app/schemas 后重新提交。"
            git status --short app/schemas
            exit 1
          fi

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
